<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      border: 3px solid #000000;
    }
    .header {
      background: #000000;
      color: #ffffff;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header svg {
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .content {
      padding: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #f0fff0;
      border: 2px solid #000000;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00c853;
    }
    .status-text {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #000000;
    }
    .info {
      font-size: 12px;
      color: #333333;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .info strong {
      color: #000000;
    }
    .shortcuts {
      background: #f5f5f5;
      border: 2px solid #000000;
      padding: 12px;
      margin-bottom: 16px;
    }
    .shortcuts-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #000000;
      margin-bottom: 8px;
    }
    .shortcut {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .shortcut:last-child {
      border-bottom: none;
    }
    .shortcut-key {
      font-size: 10px;
      font-weight: 700;
      background: #000000;
      color: #ffffff;
      padding: 4px 8px;
    }
    .shortcut-desc {
      font-size: 11px;
      color: #333333;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #000000;
      color: #ffffff;
      border: 2px solid #000000;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #ffffff;
      color: #000000;
    }
    .footer {
      padding: 12px 16px;
      background: #f5f5f5;
      border-top: 2px solid #000000;
      text-align: center;
    }
    .footer-text {
      font-size: 10px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
    <h1>Grok Canvas</h1>
  </div>

  <div class="content">
    <div class="status">
      <div class="status-dot"></div>
      <span class="status-text">Extension Active</span>
    </div>

    <p class="info">
      When you're on <strong>x.com/i/grok</strong>, click the <strong>"OPEN IN CANVAS"</strong> button (bottom-right) to send your query to Canvas.
    </p>

    <div class="shortcuts">
      <div class="shortcuts-title">How to Use</div>
      <div class="shortcut">
        <span class="shortcut-desc">Type in Grok input</span>
      </div>
      <div class="shortcut">
        <span class="shortcut-desc">Click "OPEN IN CANVAS"</span>
      </div>
    </div>

    <button class="btn" id="openCanvas">Open Canvas Now</button>
  </div>

  <div class="footer">
    <span class="footer-text">Grok Canvas v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
